version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: attocus-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    env_file:
      - path: ./.env
        required: false
      - path: ./backend/.env
        required: false
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: attocus-frontend
    ports:
      - "3000:3000"
    environment:
      - PYTHON_BACKEND_URL=http://backend:8000
    env_file:
      - path: ./.env
        required: false
      - path: ./backend/.env
        required: false
    depends_on:
      - backend
    restart: unless-stopped
